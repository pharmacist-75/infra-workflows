name: Release Tag Orchestrator

on:
  workflow_call:
    inputs:
      update-major-tag:
        description: "Whether to update the floating major version tag"
        required: false
        type: boolean
        default: false

jobs:
  version:
    uses: pharmacist-75/infra-workflows/.github/workflows/rw-compute-version.yml@v1

  tag:
    needs: version
    uses: pharmacist-75/infra-workflows/.github/workflows/rw-create-tag.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
      update-major-tag: ${{ inputs.update-major-tag }}

  release:
    needs: [version, tag]
    if: ${{ needs.tag.outputs.created == 'true' }}
    uses: pharmacist-75/infra-workflows/.github/workflows/rw-create-github-release.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
